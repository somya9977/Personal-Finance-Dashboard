<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinFlow — Personal Finance Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

<script src="https://cdn.gotrust.tech/gotrust-client/gotrust-consent-shim.js" data-safe="true"></script>
    <script src="https://cdn.gotrust.tech/gotrust-client/cookie-banner.bundle.js" data-safe="true"></script>

    
  </head>
  <body>
    <div id="root"></div>


    <div id="gotrust-cookie-banner" data-consent-banner="gotrust"></div>

    <script>
      (function () {
        function ready(fn){
          if (document.readyState !== 'loading') fn();
          else document.addEventListener('DOMContentLoaded', fn);
        }

        function tryInit() {
          if (!window.CookieBanner || typeof window.CookieBanner.init !== 'function') {
            return false;
          }

          var el = document.querySelector('#gotrust-cookie-banner');
          if (!el) return false;

          if (el.__gotrustMounted) return true;

          var respectDNT = (navigator.doNotTrack === '1' || navigator.doNotTrack === 'yes');

          window.CookieBanner.init('#gotrust-cookie-banner', {
            domainUrl: 'https://swiggy-clone-19.vercel.app/',
            environment: 'http://localhost:3000',
            domain_id: 'f39247be-8b2c-49db-87f1-32e4d4463d1f',
          });
          return true;
        }

        ready(function () {
          if (tryInit()) return;

          function onReady() { if (tryInit()) window.removeEventListener('CookieBannerReady', onReady); }
          window.addEventListener('CookieBannerReady', onReady);

          var attempts = 0;
          var t = setInterval(function () {
            attempts++;
            if (tryInit() || attempts > 20) clearInterval(t);
          }, 100);
        });
      })();
    </script>
    
    
    
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
